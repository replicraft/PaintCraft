name: ci
on:
  push:
  pull_request:
jobs:
  native-filesystem:
    name: Filesystem (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-11-arm, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.0'
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-filesystem
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install pinned native decoder build tools
        run: python -m pip install meson==1.12.1 ninja==1.13.2
      - name: Select the native Windows C compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.os == 'windows-11-arm' && 'arm64' || 'x64' }}
      - run: cargo test --locked -p paintcraft-platform --lib
      - name: Test native worker lifetime, pipe cleanup and parent-death lease
        run: cargo test --locked -p paintcraft-runtime --lib process::tests
      - name: Test actual native codec helper and independent sample fixtures
        run: cargo test --locked -p paintcraft-codec-worker --tests
      - run: python -m unittest discover -s scripts/tests -p 'test_package_*.py'
      - run: python -m unittest discover -s scripts/tests -p 'test_sign_release.py'
      - run: python -m unittest discover -s scripts/tests -p 'test_install_cli.py'
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install pinned native decoder build tools
        run: python -m pip install meson==1.12.1 ninja==1.13.2
      - run: rustc -Vv && cargo -V
      - run: python3 scripts/check_file_lengths.py
      - run: python3 scripts/check_translations.py
      - run: python3 -m unittest discover -s scripts/tests -p 'test_package_*.py'
      - run: python3 -m unittest discover -s scripts/tests -p 'test_sign_release.py'
      - run: python3 -m unittest discover -s scripts/tests -p 'test_install_cli.py'
      - run: python3 -m unittest discover -s scripts/tests -p 'test_verify_*.py'
      - run: cargo fmt --all --check
      - name: Check the isolated parser dependency lock
        if: runner.os == 'Linux'
        run: python3 fuzz/check_lock.py
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build the actual helper for installed CLI tests
        run: cargo build --locked -p paintcraft-codec-worker
      # Installed fixtures hash real binaries and enforce production deadlines.
      # Avoid overlapping independent fixtures on shared runners; concurrency
      # qualification remains a separate workload, with the deadlines unchanged.
      - name: Test the CLI and its installed helper before GUI tests
        run: cargo test --locked -p paintcraft-cli -- --nocapture --test-threads=1
      - run: cargo test --workspace --exclude paintcraft-cli
      - name: Check the isolated stable parser harness
        if: runner.os == 'Linux'
        run: |
          python3 -m unittest discover -s fuzz -p 'test_*.py'
          cargo fmt --manifest-path fuzz/Cargo.toml --check
          cargo clippy --manifest-path fuzz/Cargo.toml --locked --all-targets --target-dir target -- -D warnings
          cargo test --manifest-path fuzz/Cargo.toml --locked --target-dir target
          cargo build --manifest-path fuzz/Cargo.toml --locked --bin replay --target-dir target
      - name: Replay the checked parser seeds on stable Rust
        if: runner.os == 'Linux'
        run: |
          python3 fuzz/replay_smoke.py --replay target/debug/replay
          python3 fuzz/pcnd_point_replay_smoke.py --replay target/debug/replay
          python3 fuzz/check_lock.py
  x11-clipboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install isolated X11 test server
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - name: Test bounded clipboard transport and lifecycle
        run: cargo test --locked -p paintcraft-platform --features clipboard --lib
      - name: Test actual X11 direct and incremental selection exchanges
        run: |
          # DISPLAY must expand inside the isolated server's child shell.
          # shellcheck disable=SC2016
          xvfb-run --auto-servernum sh -c \
            'PAINTCRAFT_TEST_X11_DISPLAY="$DISPLAY" cargo test --locked -p paintcraft-platform --features clipboard --lib clipboard::read::x11::native_tests::native_x11_ -- --ignored'
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain and browser target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - run: cargo check --locked -p paintcraft-web --target wasm32-unknown-unknown
      - run: cargo clippy --locked -p paintcraft-web --target wasm32-unknown-unknown -- -D warnings
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-${{ runner.os }}-${{ runner.arch }}-0.2.129
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/paintcraft-web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: apps/paintcraft-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/paintcraft-web
      - run: pnpm run format:check
        working-directory: apps/paintcraft-web
      - run: pnpm test
        working-directory: apps/paintcraft-web
      - run: pnpm run build
        working-directory: apps/paintcraft-web
      - name: Check the runner's Chrome installation
        run: google-chrome --version
      - name: Check real Main blend rendering and lifecycle
        run: pnpm run test:main-blend-browser
        working-directory: apps/paintcraft-web
        env:
          CODEC_EVIDENCE_DIR: ${{ github.workspace }}/docs/validation/main-blend-ci
      - name: Check Studio layer mask controls and filter publication
        run: pnpm run test:studio-layer-mask-browser
        working-directory: apps/paintcraft-web
        env:
          CODEC_EVIDENCE_DIR: ${{ github.workspace }}/docs/validation/studio-layer-mask-ci
      - name: Check Studio blended layer mask ownership and rendering
        run: pnpm run test:studio-blend-mask-browser
        working-directory: apps/paintcraft-web
        env:
          CODEC_EVIDENCE_DIR: ${{ github.workspace }}/docs/validation/studio-blend-mask-ci
      - name: Check Studio filter masks on Normal layers
        run: pnpm run test:studio-filter-mask-source7-browser
        working-directory: apps/paintcraft-web
        env:
          CODEC_EVIDENCE_DIR: ${{ github.workspace }}/docs/validation/studio-filter-mask-source7-ci
      - name: Check Studio filter masks through Source8
        run: pnpm run test:studio-filter-mask-source8-browser
        working-directory: apps/paintcraft-web
        env:
          CODEC_EVIDENCE_DIR: ${{ github.workspace }}/docs/validation/studio-filter-mask-source8-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-filter-mask-browser-evidence
          path: |
            docs/validation/studio-filter-mask-source7-ci/
            docs/validation/studio-filter-mask-source8-ci/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-blend-mask-browser-evidence
          path: docs/validation/studio-blend-mask-ci/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-layer-mask-browser-evidence
          path: docs/validation/studio-layer-mask-ci/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-blend-browser-evidence
          path: docs/validation/main-blend-ci/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: paintcraft-web
          path: apps/paintcraft-web/dist/
          if-no-files-found: error
