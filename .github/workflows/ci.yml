name: ci
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: rustc -Vv && cargo -V
      - run: python3 scripts/check_file_lengths.py
      - run: python3 scripts/check_translations.py
      - run: python3 -m unittest discover -s scripts/tests -p 'test_package_*.py'
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain and browser target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - run: cargo check --locked -p paintcraft-web --target wasm32-unknown-unknown
      - run: cargo clippy --locked -p paintcraft-web --target wasm32-unknown-unknown -- -D warnings
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-${{ runner.os }}-${{ runner.arch }}-0.2.129
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/paintcraft-web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: apps/paintcraft-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/paintcraft-web
      - run: pnpm run format:check
        working-directory: apps/paintcraft-web
      - run: pnpm test
        working-directory: apps/paintcraft-web
      - run: pnpm run build
        working-directory: apps/paintcraft-web
      - uses: actions/upload-artifact@v4
        with:
          name: paintcraft-web
          path: apps/paintcraft-web/dist/
          if-no-files-found: error
