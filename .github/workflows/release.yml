name: Release
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/actions/release-tools/**'
      - 'scripts/packaging/**'
      - 'scripts/tests/test_package_*.py'
      - 'scripts/packaging/verify_windows_install.ps1'
      - 'scripts/packaging/verify_macos_release.py'
      - 'packaging/**'
      - 'assets/paintcraft-icon*'
      - 'apps/paintcraft/build.rs'
      - 'apps/paintcraft/resources/macos/**'
      - 'apps/paintcraft/Cargo.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'docs/RELEASING.md'
  workflow_dispatch:
    inputs:
      artifacts-run:
        description: Optional completed release run whose successful platform artifacts should be reused
        type: string
        default: ''
      publish-tag:
        description: Existing tag to publish when reusing artifacts (leave empty for build-only runs)
        type: string
        default: ''

permissions:
  contents: read
  actions: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Validate release contract
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.publish-tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - id: version
        env:
          RELEASE_TAG: ${{ inputs.publish-tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: python scripts/packaging/package_release.py validate --tag "$RELEASE_TAG"
      - name: Verify artifact provenance and all required platform builds
        if: inputs.artifacts-run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.artifacts-run }}
          RELEASE_TAG: ${{ inputs.publish-tag }}
        run: python scripts/packaging/verify_release_run.py --repo "$GITHUB_REPOSITORY" --run "$SOURCE_RUN" --tag "$RELEASE_TAG"
      - run: python -m unittest discover -s scripts/tests -p 'test_package_*.py'
      - run: python -m unittest discover -s scripts/tests -p 'test_qualify_cli_helper.py'
      - run: python scripts/check_file_lengths.py
      - name: Generate complete changelog
        if: inputs.artifacts-run == ''
        uses: orhun/git-cliff-action@v4
        with:
          version: v2.14.2
          args: --output CHANGELOG.md
      - uses: actions/upload-artifact@v7
        if: inputs.artifacts-run == ''
        with:
          name: release-changelog-${{ steps.version.outputs.version }}
          path: CHANGELOG.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build:
    name: Build ${{ matrix.target }}
    if: inputs.artifacts-run == ''
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            executable: paintcraft.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            executable: paintcraft.exe
          - os: macos-15
            target: aarch64-apple-darwin
            executable: paintcraft
          - os: macos-15-intel
            target: x86_64-apple-darwin
            executable: paintcraft
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            executable: paintcraft
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            executable: paintcraft
    env:
      CARGO_INCREMENTAL: '0'
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.0'
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        env:
          CACHE_ON_FAILURE: 'true'
        with:
          key: release-gpu-${{ matrix.target }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install pinned native decoder build tools
        run: python -m pip install meson==1.12.1 ninja==1.13.2
      - name: Select the native Windows C compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.target == 'aarch64-pc-windows-msvc' && 'arm64' || 'x64' }}
      - name: Install Linux build and packaging libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxcb-shape0-dev libxcb-xfixes0-dev libegl1-mesa-dev libvulkan-dev desktop-file-utils shared-mime-info appstream patchelf file rpm libfuse2
      - name: Make Windows portable builds independent of the VC runtime installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"RUSTFLAGS=-C target-feature=+crt-static" >> $env:GITHUB_ENV'
      - name: Resolve exact target helper rollout
        id: helper-policy
        run: python scripts/packaging/helper_policy.py --target ${{ matrix.target }} --github-output
      - name: Build release with GPU rendering
        run: cargo build --locked --release -p paintcraft -p paintcraft-cli -p paintcraft-codec-worker --target ${{ matrix.target }} --features paintcraft-codec-worker/${{ steps.helper-policy.outputs.feature }}
      - name: Qualify native worker controls
        run: cargo test --locked --release -p paintcraft-codec-worker --features ${{ steps.helper-policy.outputs.feature }} --target ${{ matrix.target }} --tests -- --test-threads=1
      - name: Freeze the exact installed-consumer CLI build recipe
        run: cargo test --locked --release -p paintcraft-cli --target ${{ matrix.target }} --test installed_codec_worker --no-run --message-format=json
      - name: Produce and install the exact qualification CLI archive
        run: python scripts/packaging/helper_policy.py --target ${{ matrix.target }} --prepare-installation target/${{ matrix.target }}/release/paintcraft-cli${{ runner.os == 'Windows' && '.exe' || '' }} --output "${{ runner.temp }}/paintcraft-helper-qualification-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Qualify V7 installed consumers on held targets
        if: steps.helper-policy.outputs.selector == 'v7'
        run: python scripts/packaging/qualify_cli_helper.py --profile v7 --target ${{ matrix.target }} --helper "${{ github.workspace }}/target/${{ matrix.target }}/release/paintcraft-codec-worker${{ runner.os == 'Windows' && '.exe' || '' }}"
      - name: Qualify V8 installed consumers on the promoted target
        if: steps.helper-policy.outputs.selector == 'v8'
        run: python scripts/packaging/qualify_cli_helper.py --profile v8 --target ${{ matrix.target }} --installation "${{ runner.temp }}/paintcraft-helper-qualification-${{ github.run_id }}-${{ github.run_attempt }}/prefix/bin"
      - name: Test native clipboard transport and lifecycle
        if: runner.os == 'Windows' || runner.os == 'Linux'
        run: cargo test --locked -p paintcraft-platform --features clipboard --target ${{ matrix.target }} --lib
      - name: Test Windows packed DIB decoding
        if: runner.os == 'Windows'
        run: cargo test --locked -p paintcraft-formats --target ${{ matrix.target }} --lib image::dib
      - name: Test packaging on the native platform
        run: python -m unittest discover -s scripts/tests -p 'test_package_*.py'
      - name: Install macOS DMG layout tool
        if: runner.os == 'macOS'
        run: python -m pip install dmgbuild==1.6.7
      - name: Package portable archives and macOS images
        run: python scripts/packaging/package_release.py package --version ${{ needs.version.outputs.version }} --target ${{ matrix.target }} --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --output dist
      - name: Package headless CLI
        run: python scripts/packaging/package_cli.py --version ${{ needs.version.outputs.version }} --target ${{ matrix.target }} --binary target/${{ matrix.target }}/release/paintcraft-cli${{ runner.os == 'Windows' && '.exe' || '' }} --output dist
      - name: Verify macOS image and updater ZIP contain the identical signed app
        if: runner.os == 'macOS'
        shell: bash
        run: python scripts/packaging/verify_macos_release.py --version ${{ needs.version.outputs.version }} --target ${{ matrix.target }} --dmg dist/*.dmg --update dist/*-update.zip
      - uses: ./.github/actions/release-tools
        if: runner.os == 'Linux'
      - name: Package Linux installers
        if: runner.os == 'Linux'
        run: python scripts/packaging/package_linux.py --version ${{ needs.version.outputs.version }} --target ${{ matrix.target }} --binary target/${{ matrix.target }}/release/paintcraft --output dist
      - name: Inspect Linux desktop integration and native packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          desktop-file-validate packaging/paintcraft.desktop
          appstreamcli validate --no-net packaging/paintcraft.metainfo.xml
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          rpm -qip dist/*.rpm
          rpm -qlp dist/*.rpm
          ldd target/${{ matrix.target }}/release/paintcraft | tee dependencies.txt
          if grep -q 'not found' dependencies.txt; then exit 1; fi
          appimage=$(realpath dist/*.AppImage)
          inspection=$(mktemp -d)
          cd "$inspection"
          "$appimage" --appimage-extract > /dev/null
          test -x squashfs-root/usr/bin/paintcraft
          test -x squashfs-root/usr/bin/paintcraft-codec-worker
          test -f squashfs-root/usr/share/paintcraft/paintcraft-codec-worker.json
          test -f squashfs-root/usr/share/mime/packages/paintcraft.xml
      - name: Install WiX 5 for both Windows architectures
        if: runner.os == 'Windows'
        run: dotnet tool install --global wix --version 5.0.2 --allow-roll-forward
      - name: Package Windows MSI
        if: runner.os == 'Windows'
        run: python scripts/packaging/package_windows.py --version ${{ needs.version.outputs.version }} --target ${{ matrix.target }} --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --output dist
      - name: Verify MSI installation, repair and association cleanup
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/packaging/verify_windows_install.ps1 -Installer (Get-ChildItem dist/*.msi).FullName -Binary target/${{ matrix.target }}/release/paintcraft.exe
      - uses: actions/upload-artifact@v7
        with:
          name: paintcraft-${{ needs.version.outputs.version }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure() && runner.os == 'Windows'
        with:
          name: windows-installer-logs-${{ matrix.target }}
          path: msi-*.log

  assemble:
    name: Verify complete release and checksums
    needs: [version, build]
    if: ${{ !cancelled() && needs.version.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.publish-tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          pattern: paintcraft-${{ needs.version.outputs.version }}-*
          path: dist
          merge-multiple: true
          run-id: ${{ inputs.artifacts-run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Require every platform and generate SHA256SUMS.txt
        run: python scripts/packaging/package_release.py finalize --version ${{ needs.version.outputs.version }} --output dist
      - name: Independently verify final checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: paintcraft-release-${{ needs.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish complete GitHub release
    needs: [version, assemble]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.assemble.result == 'success' && ((github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.artifacts-run != '' && inputs.publish-tag != '')) }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.publish-tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          name: paintcraft-release-${{ needs.version.outputs.version }}
          path: dist
      - name: Publish after every platform succeeds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.publish-tag || github.ref_name }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS.txt
          cd ..
          python scripts/packaging/package_release.py notes --version "$RELEASE_VERSION" --output release-body.md
          if gh release view "$RELEASE_TAG" --json isDraft > release.json; then
            if ! jq -e '.isDraft == true' release.json > /dev/null; then
              echo '::error::Release already published; use a new version tag.'
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --notes-file release-body.md --title "PaintCraft $RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort > uploaded.txt
          find dist -maxdepth 1 -type f -printf '%f\n' | sort > expected.txt
          diff -u expected.txt uploaded.txt
          prerelease=false
          if [[ "$RELEASE_VERSION" == *-* ]]; then prerelease=true; fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$prerelease" --notes-file release-body.md
