name: Native codec candidate qualification
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact public helper candidate to qualify
        type: choice
        options: [both, v8, v9, v10]
        default: both
  pull_request:
    paths:
      - '.github/workflows/native-codec-qualification.yml'
      - '.github/workflows/release.yml'
      - 'scripts/packaging/**'
      - 'scripts/tests/test_package_native_qualification.py'
      - 'scripts/tests/test_qualify_cli_helper.py'
      - 'scripts/tests/test_package_jxl_integer_contract.py'
      - 'scripts/tests/test_integer_qualification_flow.py'
      - 'scripts/tests/test_native_candidate_contracts.py'
      - 'apps/paintcraft-codec-worker/**'
      - 'apps/paintcraft-cli/**'
      - 'apps/paintcraft/**'
      - 'crates/services/paintcraft-formats/**'
      - 'crates/services/paintcraft-platform/**'
      - 'crates/services/paintcraft-runtime/**'
      - 'crates/services/paintcraft-render/**'
      - 'crates/foundation/paintcraft-core/**'
      - 'crates/foundation/paintcraft-document/**'
      - 'crates/foundation/paintcraft-raster/**'
      - 'crates/editing/paintcraft-editor/**'
      - 'crates/presentation/paintcraft-ui/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'vendor/jxl-0.8.0-paintcraft1/**'
      - 'vendor/jxl-0.8.0-paintcraft1*'
      - 'rust-toolchain.toml'
permissions:
  contents: read
jobs:
  candidate:
    name: Public ${{ matrix.candidate }} candidate (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        candidate: ${{ fromJSON(inputs.candidate == 'v8' && '["v8"]' || inputs.candidate == 'v9' && '["v9"]' || inputs.candidate == 'v10' && '["v10"]' || '["v9","v10"]') }}
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    env:
      CARGO_INCREMENTAL: '0'
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.0'
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        env:
          CACHE_ON_FAILURE: 'true'
        with:
          key: native-codec-candidate-${{ matrix.target }}-${{ matrix.candidate }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install pinned native decoder build tools
        run: python -m pip install meson==1.12.1 ninja==1.13.2
      - name: Select the native Windows C compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.target == 'aarch64-pc-windows-msvc' && 'arm64' || 'x64' }}
      - name: Install native Linux desktop link dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxcb-shape0-dev libxcb-xfixes0-dev libegl1-mesa-dev libvulkan-dev desktop-file-utils shared-mime-info appstream patchelf file rpm libfuse2
      - name: Match Windows Rust and C static CRT
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"RUSTFLAGS=-C target-feature=+crt-static" >> $env:GITHUB_ENV'
      - name: Check candidate orchestration contracts
        run: python -m unittest discover -s scripts/tests -p 'test_native_candidate_contracts.py'
      - name: Build and execute the selected native public candidate
        run: python scripts/packaging/qualify_native_codecs.py --target ${{ matrix.target }} --candidate ${{ matrix.candidate }} --output "${{ runner.temp }}/paintcraft-native-qualification-${{ matrix.target }}-${{ matrix.candidate }}-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Retain success and failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-codec-candidate-${{ matrix.target }}-${{ matrix.candidate }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/paintcraft-native-qualification-${{ matrix.target }}-${{ matrix.candidate }}-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 7
