[package]
name = "paintcraft-platform"
description = "Native dialogs, clipboard and filesystem adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[features]
default = []
printing = []
clipboard = [
    "dep:arboard",
    "dep:clipboard-win",
    "dep:wl-clipboard-rs",
    "dep:rustix",
    "dep:x11rb",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
]
menus = ["dep:muda"]
fonts = ["dep:fontdb"]
dialogs = ["dep:rfd", "dep:raw-window-handle", "dep:pollster"]

[dependencies]
paintcraft-core.workspace = true
fontdb = { workspace = true, optional = true }
arboard = { workspace = true, optional = true }

pollster = { workspace = true, optional = true }
raw-window-handle = { workspace = true, optional = true }
rfd = { workspace = true, optional = true }
sha2.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true, optional = true }
objc2-app-kit = { workspace = true, optional = true }
objc2-foundation = { workspace = true, optional = true }
muda = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = { workspace = true, optional = true }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
wl-clipboard-rs = { workspace = true, optional = true }
rustix = { workspace = true, optional = true }
x11rb = { workspace = true, optional = true }

[target.'cfg(unix)'.dev-dependencies]
rustix = { workspace = true, features = ["pipe"] }
x11rb.workspace = true

[lints]
workspace = true
