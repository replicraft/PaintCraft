[package]
name = "paintcraft-render"
description = "Ordered scalar and GPU document compositing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[features]
default = []
gpu = ["dep:wgpu", "dep:bytemuck"]

[dependencies]
paintcraft-core.workspace = true
paintcraft-document.workspace = true
paintcraft-raster.workspace = true

bytemuck = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }

[dev-dependencies]
divan.workspace = true
paintcraft-editor.workspace = true

pollster.workspace = true

[[bench]]
name = "composite"
harness = false

[lints]
workspace = true
