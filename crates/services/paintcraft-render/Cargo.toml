[package]
name = "paintcraft-render"
description = "Ordered CPU and GPU document compositing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[features]
# The u16 kernel dispatches only to NEON, SSE2 or SIMD128; other builds use scalar.
default = ["simd-u16"]
simd = ["dep:wide"]
# Retain the first implementation for source-matched benchmark comparisons.
simd-channels = ["simd"]
simd-u16 = ["simd"]
gpu = ["dep:wgpu", "dep:bytemuck"]

[dependencies]
paintcraft-core.workspace = true
paintcraft-document.workspace = true
paintcraft-raster.workspace = true
rayon.workspace = true
wide = { workspace = true, optional = true }

bytemuck = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }

[dev-dependencies]
divan.workspace = true
criterion.workspace = true
paintcraft-editor.workspace = true

pollster.workspace = true

[[bench]]
name = "composite"
harness = false

[[bench]]
name = "cache_replay"
harness = false

[[bench]]
name = "partitioned"
harness = false

[lints]
workspace = true

[[bench]]
name = "regional_reuse"
harness = false

[[bench]]
name = "simd_composite"
harness = false
