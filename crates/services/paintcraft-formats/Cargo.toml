[package]
name = "paintcraft-formats"
description = "Native PCND projects and bounded raster image codecs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[features]
exr-codec = ["dep:exr"]
# Private qualification only; no registry/frontend reader route.
hdr-codec = ["image/hdr"]
heif-codec = ["dep:heic-decoder"]

[dependencies]
exr = { workspace = true, optional = true }
heic-decoder = { workspace = true, optional = true }
paintcraft-core.workspace = true
paintcraft-document.workspace = true
paintcraft-raster.workspace = true
paintcraft-paint.workspace = true
paintcraft-pdn.workspace = true
paintcraft-render.workspace = true

image.workspace = true
png.workspace = true
quick-xml.workspace = true
flate2.workspace = true
crc32fast.workspace = true
pcx.workspace = true
color_quant.workspace = true
ico.workspace = true
icns.workspace = true
ag-psd.workspace = true
resvg = { workspace = true, features = ["text", "raster-images"] }
base64.workspace = true
qoi.workspace = true
tiff.workspace = true
dds.workspace = true
jxl.workspace = true
zune-jpegxl.workspace = true
zune-core.workspace = true
ruzstd.workspace = true
lz4_flex.workspace = true
zerocopy.workspace = true
sha2.workspace = true
uuid.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
paintcraft-platform.workspace = true
zstd.workspace = true

[dev-dependencies]
heic-decoder.workspace = true
divan.workspace = true
criterion.workspace = true
paintcraft-commands.workspace = true
paintcraft-editor.workspace = true
paintcraft-runtime.workspace = true

[lints]
workspace = true

[[bench]]
name = "raster_codecs"
harness = false

[[bench]]
name = "palette_assets"
harness = false

[[bench]]
name = "palette_samples"
harness = false

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
jpegxr.workspace = true
