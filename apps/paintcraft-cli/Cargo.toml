[package]
name = "paintcraft-cli"
description = "Headless PaintCraft: create, inspect, edit and render documents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[[bin]]
name = "paintcraft-cli"
path = "src/main.rs"

[dependencies]
paintcraft-types = { path = "../../crates/paintcraft-types" }
paintcraft-core = { path = "../../crates/paintcraft-core" }
paintcraft-formats = { path = "../../crates/paintcraft-formats" }
sha2 = "0.11.1"
uuid = { version = "1.28.0", features = ["v4"] }

[lints]
workspace = true
