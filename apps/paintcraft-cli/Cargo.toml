[package]
name = "paintcraft-cli"
description = "Headless PaintCraft: create, inspect, edit and render documents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[[bin]]
name = "paintcraft-cli"
path = "src/main.rs"

[dependencies]
paintcraft-core.workspace = true
paintcraft-document.workspace = true
paintcraft-editor.workspace = true
paintcraft-commands.workspace = true
paintcraft-tools.workspace = true
paintcraft-formats.workspace = true
paintcraft-render.workspace = true
paintcraft-platform.workspace = true

clap.workspace = true
rayon.workspace = true
sha2.workspace = true
same-file.workspace = true
rmcp.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true

[dev-dependencies]
png.workspace = true

[target.'cfg(unix)'.dev-dependencies]
rustix.workspace = true
