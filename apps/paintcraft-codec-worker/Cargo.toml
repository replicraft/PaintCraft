[package]
name = "paintcraft-codec-worker"
description = "Single-request isolated native decoder helper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[features]
default = ["float-codecs"]
# Private fresh-encode qualification only; never a default build capability.
jxr-encode = ["float-codecs"]
# Explicit final-descriptor qualification build; default remains V7.
jxr-codecs = ["jxr-encode"]
float-codecs = ["avif-sdr-codec", "paintcraft-formats/hdr-codec", "paintcraft-formats/exr-codec"]
avif-codec = []
avif-sdr-codec = ["avif-codec"]

[build-dependencies]
sha2.workspace = true

[dependencies]
paintcraft-core.workspace = true
paintcraft-formats = { workspace = true, features = ["heif-codec"] }
rayon.workspace = true
libc.workspace = true
jpegxr.workspace = true

[dev-dependencies]
sha2.workspace = true
paintcraft-platform.workspace = true
paintcraft-runtime.workspace = true
uuid.workspace = true

# Unsafe is scoped to this executable's global allocator and optional native AVIF
# ABI. All other helper code is denied; other workspace crates retain forbid.
# The remaining workspace lints match.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
