[package]
name = "paintcraft"
description = "PaintCraft desktop application (egui + wgpu)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "paintcraft"
path = "src/main.rs"

[dependencies]
paintcraft-classic.workspace = true
paintcraft-studio.workspace = true
paintcraft-commands.workspace = true
paintcraft-core.workspace = true
paintcraft-document.workspace = true
paintcraft-editor.workspace = true
paintcraft-formats.workspace = true
paintcraft-input.workspace = true
paintcraft-platform = { workspace = true, features = ["dialogs", "menus", "fonts", "printing", "clipboard", "tablet"] }
paintcraft-raster.workspace = true
paintcraft-runtime = { workspace = true, features = ["native-io"] }
paintcraft-render = { workspace = true, features = ["gpu"] }
paintcraft-tools = { workspace = true, features = ["text"] }
paintcraft-ui.workspace = true

eframe.workspace = true
sha2.workspace = true
same-file.workspace = true
uuid.workspace = true

[dev-dependencies]
criterion.workspace = true
pollster.workspace = true
wgpu.workspace = true
egui_kittest = { workspace = true, features = ["wgpu"] }

[build-dependencies]
winresource.workspace = true

[lints]
workspace = true

[package.metadata.generate-rpm]
name = "paintcraft"
license = "MIT"
summary = "Draw, paint and edit images"
url = "https://github.com/replicraft/PaintCraft"
assets = [
    { source = "target/release/paintcraft", dest = "/usr/bin/paintcraft", mode = "755" },
    { source = "packaging/paintcraft.desktop", dest = "/usr/share/applications/paintcraft.desktop", mode = "644" },
    { source = "assets/paintcraft-icon.iconset/icon_256x256.png", dest = "/usr/share/icons/hicolor/256x256/apps/paintcraft.png", mode = "644" },
    { source = "packaging/paintcraft.metainfo.xml", dest = "/usr/share/metainfo/io.github.replicraft.PaintCraft.metainfo.xml", mode = "644" },
    { source = "packaging/paintcraft-mime.xml", dest = "/usr/share/mime/packages/paintcraft.xml", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/paintcraft/LICENSE", mode = "644", doc = true },
    { source = "packaging/FONT_LICENSES.txt", dest = "/usr/share/licenses/paintcraft/FONT_LICENSES.txt", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
glibc = ">= 2.35"
libgcc = "*"
libX11 = "*"
libxcb = "*"
libxkbcommon = "*"
wayland-libs = "*"
"mesa-libEGL" = "*"
"mesa-libGL" = "*"
"vulkan-loader" = "*"
"xdg-desktop-portal" = "*"
"shared-mime-info" = "*"
"desktop-file-utils" = "*"
"libX11-xcb.so.1()(64bit)" = "*"
"libXcursor.so.1()(64bit)" = "*"
"libXi.so.6()(64bit)" = "*"
"libXrandr.so.2()(64bit)" = "*"
"libxkbcommon-x11.so.0()(64bit)" = "*"
