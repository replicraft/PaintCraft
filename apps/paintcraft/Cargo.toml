[package]
name = "paintcraft"
description = "PaintCraft desktop application (egui + wgpu)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "paintcraft"
path = "src/main.rs"

[dependencies]
paintcraft-classic.workspace = true
paintcraft-studio.workspace = true
paintcraft-commands.workspace = true
paintcraft-core.workspace = true
paintcraft-document.workspace = true
paintcraft-editor.workspace = true
paintcraft-formats.workspace = true
paintcraft-input.workspace = true
paintcraft-platform = { workspace = true, features = ["dialogs", "menus", "fonts"] }
paintcraft-raster.workspace = true
paintcraft-runtime = { workspace = true, features = ["native-io"] }
paintcraft-render = { workspace = true, features = ["gpu"] }
paintcraft-tools.workspace = true
paintcraft-ui.workspace = true

cosmic-text.workspace = true
eframe.workspace = true
sha2.workspace = true
uuid.workspace = true

[dev-dependencies]
criterion.workspace = true
pollster.workspace = true
wgpu.workspace = true
egui_kittest = { workspace = true, features = ["wgpu"] }

[lints]
workspace = true
