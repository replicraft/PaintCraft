[package]
name = "paintcraft-web"
description = "PaintCraft browser frontend: initial Classic UI preview"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
paintcraft-classic.workspace = true
paintcraft-core.workspace = true
paintcraft-tools.workspace = true
paintcraft-ui.workspace = true
eframe.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["HtmlCanvasElement"] }
# Explicit browser backends: prefer WebGPU, retain WebGL where available.
wgpu = { workspace = true, features = ["webgpu", "webgl"] }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["eframe"] }

[lints]
workspace = true
