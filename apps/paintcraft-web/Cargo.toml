[package]
name = "paintcraft-web"
description = "PaintCraft browser editor with Classic presentation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
paintcraft-classic.workspace = true
paintcraft-core.workspace = true
paintcraft-commands.workspace = true
paintcraft-document.workspace = true
paintcraft-editor.workspace = true
paintcraft-render.workspace = true
paintcraft-formats.workspace = true
sha2.workspace = true
paintcraft-input.workspace = true
uuid.workspace = true
paintcraft-tools = { workspace = true, features = ["text"] }
paintcraft-ui.workspace = true
eframe.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }
rfd = { workspace = true, features = ["file-handle-inner"] }
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["HtmlCanvasElement", "HtmlElement", "Window", "Document", "Storage"] }
# Explicit browser backends: prefer WebGPU, retain WebGL where available.
wgpu = { workspace = true, features = ["webgpu", "webgl"] }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["eframe"] }

[lints]
workspace = true
