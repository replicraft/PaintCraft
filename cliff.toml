[changelog]
header = "# Changelog\n\n"
body = """
## {{ version | default(value="Unreleased") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first }} ({{ commit.id | truncate(length=7, end="") }})
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+(?:[-+].*)?$'
sort_commits = "oldest"
commit_parsers = [
    { message = "^Merge (pull request|branch|remote-tracking branch)", skip = true },
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^docs?", group = "Documentation" },
    { message = "^(ci|build|test|chore|style)", group = "Maintenance" },
    { message = ".*", group = "Other changes" },
]
