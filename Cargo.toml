[workspace]
resolver = "3"
members = [
    "crates/foundation/*",
    "crates/editing/*",
    "crates/services/*",
    "crates/adapters/*",
    "crates/presentation/*",
    "apps/*",
]
default-members = ["apps/paintcraft"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
# PaintCraft foundation: common types, document storage and input contracts.
paintcraft-core = { path = "crates/foundation/paintcraft-core" }
paintcraft-raster = { path = "crates/foundation/paintcraft-raster" }
paintcraft-document = { path = "crates/foundation/paintcraft-document" }
paintcraft-input = { path = "crates/foundation/paintcraft-input" }

# Editing: command schemas, recorded history, sessions and tool state machines.
paintcraft-commands = { path = "crates/editing/paintcraft-commands" }
paintcraft-history = { path = "crates/editing/paintcraft-history" }
paintcraft-editor = { path = "crates/editing/paintcraft-editor" }
paintcraft-tools = { path = "crates/editing/paintcraft-tools" }

# Services: rendering, scheduling, formats and OS integration.
paintcraft-render = { path = "crates/services/paintcraft-render" }
paintcraft-runtime = { path = "crates/services/paintcraft-runtime" }
paintcraft-formats = { path = "crates/services/paintcraft-formats" }
paintcraft-platform = { path = "crates/services/paintcraft-platform" }

# Native format adapters with bounded, inert parsers.
paintcraft-pdn = { path = "crates/adapters/pdn-lib" }
paintcraft-paint = { path = "crates/adapters/paint-lib" }
quick-xml = { version = "0.41.0", default-features = false }

# Presentation: shared widgets and frontend skins/workspaces.
paintcraft-ui = { path = "crates/presentation/paintcraft-ui" }
paintcraft-classic = { path = "crates/presentation/paintcraft-classic" }
paintcraft-studio = { path = "crates/presentation/paintcraft-studio" }

# Shared typed error implementations; preserve PaintCraft error codes and wire contracts.
thiserror = "2.0.21"

# Command-line interface.
clap = { version = "4.6.7", features = ["derive"] }

# MCP automation over stdio.
rmcp = { version = "3.7.0", default-features = false, features = ["server", "macros", "transport-io", "base64"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
schemars = "1.0"
base64 = "0.23.1"

# Shared interface localization.
fluent-bundle = "0.16.0"
unic-langid = "0.9.6"

# Desktop presentation and GUI verification.
egui = "0.37.0"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11", "accesskit"] }
egui_kittest = "0.37.0"
# In-process renderer measurements; development-only consumers.
divan = "0.1.21"
# Statistical sample/CSV export for reproducible partition comparisons.
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support", "csv_output"] }
# SVG renderer. UI assets use this baseline; document import opts into text/images.
resvg = { version = "0.48.1", default-features = false }

# Browser entry point and JavaScript bindings.
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = "0.3.106"
js-sys = "0.3.106"

# Native menus, installed-font catalog, clipboard ownership and file dialogs.
muda = { version = "0.21.2", default-features = false }
arboard = { version = "3.7.0", default-features = false, features = ["image-data", "wayland-data-control"] }
# Bounded encoded Windows reads; reuse the clipboard-win version locked by arboard.
clipboard-win = "5.4.1"
# Encoded Wayland transfers and cancellable Unix pipe reads; already locked by arboard.
wl-clipboard-rs = { version = "0.9.4", default-features = false }
# Bounded X11 selection reads; reuse arboard's locked pure-Rust protocol client.
x11rb = { version = "0.13.2", default-features = false }
rustix = { version = "1.1.5", default-features = false, features = ["std", "event", "fs"] }
same-file = "1.0.6"
# Encoded macOS pasteboard reads, before decoder allocation; writes use arboard.
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSObject", "NSString"] }

fontdb = { version = "0.23.0", default-features = false, features = ["std", "fs"] }
rfd = "0.17.2"
raw-window-handle = "0.6.2"
# Native Windows executable icon and version metadata.
winresource = "0.1.34"

# Explicit integer SIMD kernels; renderer enables only with its simd feature.
wide = "1.7.1"

# GPU compositing; kept optional for headless consumers.
bytemuck = { version = "1.25.2", features = ["derive"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "metal", "dx12", "vulkan", "gles", "wgsl"] }
pollster = "0.4.0"

# Admitted native CPU workers and transient handles.
rayon = "1.12.0"
slotmap = "1.1.1"
# Native ordered I/O coordination; no async runtime in CPU-only consumers.
tokio = { version = "1.53.3", default-features = false, features = ["rt", "sync"] }

# Continuous geometry behind PaintCraft-owned coordinate spaces.
glam = { version = "0.34.1", default-features = false, features = ["std", "f64"] }

# Lossless history compression and bounded native-document block codecs.
lz4_flex = { version = "0.14.0", default-features = false, features = ["safe-encode", "safe-decode", "checked-decode"] }
zstd = { version = "0.14.3", default-features = false }
ruzstd = { version = "0.8.3", default-features = false, features = ["std", "hash"] }

# Identity, integrity and text rasterization.
uuid = { version = "1.28.0", features = ["v4", "v5"] }
sha2 = "0.11.1"
crc32fast = "1.5.2"
font8x8 = "0.3.1"
# Desktop document shaping and grayscale glyph rasterization; legacy bitmap commands remain stable.
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "swash", "shape-run-cache"] }

# Standard image codecs and bounded binary header views.
image = { version = "0.25.10", default-features = false, features = ["png", "bmp", "jpeg", "gif", "tiff", "tga", "webp", "avif", "pnm", "ff"] }
# Explicit TIFF alpha tags are unavailable through image's encoder facade.
tiff = { version = "0.11.3", default-features = false }
zerocopy = { version = "0.8.63", features = ["derive"] }
# JPEG XL adapters: pure Rust decoder and a separately scoped lossless writer.
jxl = { version = "0.8.0", default-features = false }
zune-jpegxl = { version = "0.5.2", default-features = false, features = ["std"] }
zune-core = { version = "0.5.3", default-features = false, features = ["std"] }
# Studio single-surface DDS adapter; no implicit Rayon pool.
dds = { version = "0.2.0", default-features = false }
# Legacy PCX import/export and explicit palette preparation.
pcx = "0.2.5"
color_quant = "1.1.0"
# Icon/cursor directories with explicit entry selection and hotspot metadata.
ico = "0.6.0"
# Studio PSD/PSB layered conversion; named, preflighted subsets only.
ag-psd = { version = "0.3.0", default-features = false }
# Force RGBA QOI output; the facade may use its informative RGB header instead.
qoi = "0.4.1"
# Bounded DEFLATE payloads in converted PAINT documents.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
# Native-only developer qualification of the selected experimental JXR backend.
jpegxr = { package = "jpegxr-pure-rs", version = "=0.1.0", default-features = false }
# Independent PNG fixture generation in tests.
png = "0.18.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = "line-tables-only"

# Browser packaging profile; keep desktop release diagnostics unchanged.
[profile.web-release]
inherits = "release"
debug = false
strip = "symbols"
lto = true
codegen-units = 1

# Keep raster/compositor hot loops responsive under the default desktop dev run.
# Debug information, overflow checks and desktop/controller debuggability remain enabled.
[profile.dev.package.paintcraft-raster]
opt-level = 2
[profile.dev.package.paintcraft-render]
opt-level = 2
[profile.dev.package.paintcraft-editor]
opt-level = 2
[profile.dev.package.paintcraft-document]
opt-level = 2
[profile.dev.package.paintcraft-core]
opt-level = 2
