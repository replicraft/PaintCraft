[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
default-members = ["apps/paintcraft"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
# PaintCraft foundations and editing engine.
paintcraft-core = { path = "crates/paintcraft-core" }
paintcraft-raster = { path = "crates/paintcraft-raster" }
paintcraft-document = { path = "crates/paintcraft-document" }
paintcraft-commands = { path = "crates/paintcraft-commands" }
paintcraft-history = { path = "crates/paintcraft-history" }
paintcraft-editor = { path = "crates/paintcraft-editor" }
paintcraft-input = { path = "crates/paintcraft-input" }
paintcraft-tools = { path = "crates/paintcraft-tools" }
paintcraft-render = { path = "crates/paintcraft-render" }
paintcraft-runtime = { path = "crates/paintcraft-runtime" }
paintcraft-formats = { path = "crates/paintcraft-formats" }
paintcraft-platform = { path = "crates/paintcraft-platform" }
paintcraft-ui = { path = "crates/paintcraft-ui" }
paintcraft-classic = { path = "crates/paintcraft-classic" }
paintcraft-studio = { path = "crates/paintcraft-studio" }

# Command-line interface.
clap = { version = "4.6.7", features = ["derive"] }

# Desktop presentation and GUI verification.
egui = "0.37.0"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11", "accesskit"] }
egui_kittest = "0.37.0"
# Bundled SVG UI assets; path/gradient rendering without font or raster-image loading.
resvg = { version = "0.48.1", default-features = false }

# Native menus, installed-font catalog and file dialogs.
muda = { version = "0.21.2", default-features = false }
fontdb = { version = "0.24.0", default-features = false, features = ["std", "fs"] }
rfd = "0.17.2"
raw-window-handle = "0.6.2"

# GPU compositing; kept optional for headless consumers.
bytemuck = { version = "1.25.2", features = ["derive"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "metal", "dx12", "vulkan", "gles", "wgsl"] }
pollster = "0.4.0"

# Admitted native CPU workers and transient handles.
rayon = "1.12.0"
slotmap = "1.1.1"
# Native ordered I/O coordination; no async runtime in CPU-only consumers.
tokio = { version = "1.53.3", default-features = false, features = ["rt", "sync"] }

# Continuous geometry behind PaintCraft-owned coordinate spaces.
glam = { version = "0.34.1", default-features = false, features = ["std", "f64"] }

# Identity, integrity and text rasterization.
uuid = { version = "1.28.0", features = ["v4", "v5"] }
sha2 = "0.11.1"
crc32fast = "1.5.2"
font8x8 = "0.3.1"

# Standard image codecs and bounded binary header views.
image = { version = "0.25.10", default-features = false, features = ["png", "bmp", "jpeg"] }
zerocopy = { version = "0.8.63", features = ["derive"] }
# Independent PNG fixture generation in tests.
png = "0.18.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = "line-tables-only"

# Keep raster/compositor hot loops responsive under the default desktop dev run.
# Debug information, overflow checks and desktop/controller debuggability remain enabled.
[profile.dev.package.paintcraft-raster]
opt-level = 2
[profile.dev.package.paintcraft-render]
opt-level = 2
[profile.dev.package.paintcraft-editor]
opt-level = 2
[profile.dev.package.paintcraft-document]
opt-level = 2
[profile.dev.package.paintcraft-core]
opt-level = 2
